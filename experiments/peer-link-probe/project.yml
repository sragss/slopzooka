name: PeerLinkProbe
options:
  deploymentTarget:
    visionOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PeerLinkViewer:
    type: application
    platform: visionOS
    sources:
      - path: Sources
        excludes: [Host.swift, CLI.swift, Checks.swift]
      - path: build/connection.json
        buildPhase: resources
    info:
      path: build/Viewer-Info.plist
      properties:
        CFBundleDisplayName: Slz Link Probe
        NSLocalNetworkUsageDescription: Measure the connection to your Mac for the isolated SlopZooka link experiment.
        NSBonjourServices: ["_slz-link._tcp"]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopzooka.probe.peerlink
        INFOPLIST_FILE: Viewer-Info.plist
    scheme: {}
