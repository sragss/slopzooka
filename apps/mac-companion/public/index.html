<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SlopZooka Host</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#0c111a;color:#e9edf4}button,input,select{font:inherit;padding:8px;margin:5px}a{color:#96caff}li{margin:12px 0}iframe{width:100%;height:600px;border:0}#status{white-space:pre-wrap}</style></head>
<body><h1>SlopZooka</h1><p>Connect to your host, reopen terminals, and view your frontends.</p>
<form id="pair"><input id="code" placeholder="Pairing code from Mac" autocomplete="off"><button>Pair</button></form>
<p id="status"></p><h2>Sessions</h2><ul id="sessions"></ul><h2>Workspaces</h2><ul id="workspaces"></ul><h2>Frontends</h2><form id="add-frontend"><input id="frontend-url" placeholder="http://localhost:3000 or https://…" aria-label="Frontend URL" required><button>Add URL</button></form><ul id="frontends"></ul>
<script type="module" src="/harness.js"></script></body></html>
