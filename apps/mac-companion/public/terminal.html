<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SlopZooka Terminal</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="stylesheet" href="/terminal.css" />
    <script>
      // The headset renders the same connection state natively, including before
      // this document loads. Browser terminals use the centered HTML notice.
      if (window.webkit?.messageHandlers?.terminalState)
        document.documentElement.dataset.nativeTerminal = "true";
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070b;
        --overlay: rgba(12, 16, 24, 0.84);
        --border: rgba(136, 153, 176, 0.24);
        --text: #e7edf7;
        --muted: #99a7bc;
        --error: #ffb4b4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at top, #121824, var(--bg) 55%);
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      #terminal {
        width: 100%;
        height: 100%;
      }

      [hidden] {
        display: none !important;
      }

      .connection-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        pointer-events: none;
      }

      [data-native-terminal] .connection-overlay {
        display: none;
      }

      .connection-card {
        max-width: 440px;
        padding: 24px 32px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--overlay);
        backdrop-filter: blur(14px);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
        line-height: 1.5;
      }

      #connection-message {
        font-size: 18px;
        font-weight: 600;
      }

      #connection-guidance {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      #read-only {
        display: flex;
        align-items: center;
        gap: 10px;
        position: fixed;
        top: 14px;
        left: 14px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--overlay);
        color: var(--muted);
        font-size: 13px;
        pointer-events: none;
      }

      #take-control {
        pointer-events: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      [data-native-terminal] #take-control {
        display: none;
      }

      .error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div
      id="connection-overlay"
      class="connection-overlay"
      role="status"
      aria-live="polite"
    >
      <div class="connection-card">
        <div id="connection-message">Connecting to your Mac…</div>
        <p id="connection-guidance" hidden>Reopen SlopZooka on your Mac.</p>
      </div>
    </div>
    <div id="read-only" hidden>
      Read only
      <button id="take-control" type="button" hidden>Take Control</button>
    </div>
    <script type="module" src="/terminal.js"></script>
  </body>
</html>
