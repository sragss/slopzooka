name: ConnectionLab
options:
  deploymentTarget:
    visionOS: "26.2"
targets:
  ConnectionLab:
    type: application
    platform: visionOS
    sources:
      - path: ConnectionLab
        excludes: [Info.plist]
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ConnectionLab/Info.plist
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.samragsdale.SlopZooka.ConnectionLab
        SUPPORTED_PLATFORMS: xros xrsimulator
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        TARGETED_DEVICE_FAMILY: 7
schemes:
  ConnectionLab:
    build:
      targets:
        ConnectionLab: all
    run:
      config: Debug
