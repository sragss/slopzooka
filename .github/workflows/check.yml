name: Companion checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  companion:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:vision-state
      - run: pnpm build:harness
      - run: git diff --exit-code -- apps/mac-companion/public
      - run: pnpm build:mac-app
        env:
          SLOPZOOKA_SIGN_IDENTITY: "-"
      - run: pnpm test:mac-app
  vision:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build visionOS simulator app
        run: |
          xcodebuild -project apps/vision-client/SlopZooka/SlopZooka.xcodeproj \
            -scheme SlopZooka -sdk xrsimulator -configuration Debug \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/slz-derived" CODE_SIGNING_ALLOWED=NO build
