name: Companion checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  companion:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build:harness
      - run: git diff --exit-code -- apps/mac-companion/public
      - run: pnpm build:mac-app
        env:
          SLOPZOOKA_SIGN_IDENTITY: "-"
      - run: pnpm test:mac-app
