name: Companion checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm lint:ts
      - run: pnpm typecheck
      - run: pnpm format:check

  integration-and-keyboard:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm test
      - run: pnpm test:terminal-keyboard

  native-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-workspace
      - run: pnpm setup:swiftlint
      - run: pnpm lint:swift
      - run: pnpm test:vision-state
      - run: pnpm build:mac-app
        env:
          SLOPZOOKA_SIGN_IDENTITY: "-"
      # The package build regenerates the browser assets before staging them.
      - run: git diff --exit-code -- apps/mac-companion/public
      - run: pnpm test:mac-app

  companion:
    needs: [source-checks, integration-and-keyboard, native-and-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all companion jobs to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$CHECK_RESULTS"
